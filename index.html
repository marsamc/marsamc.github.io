async function open(pw){const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(S),iterations:N,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(I)},k,d(C));return new TextDecoder().decode(pt)}
async function go(pw,remember){const btn=document.getElementById('go');btn.disabled=true;btn.textContent='여는 중…';
 try{const html=await open(pw);try{remember&&sessionStorage.setItem('marsPw',pw)}catch(e){}document.open();document.write(html);document.close()}
 catch(e){document.getElementById('err').textContent='비밀번호가 맞지 않습니다.';btn.disabled=false;btn.textContent='열기';try{sessionStorage.removeItem('marsPw')}catch(e){}}}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();go(document.getElementById('pw').value,true)});
